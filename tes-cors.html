<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tes CORS - Qasir Minum.Es</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; background: #0f172a; color: #e2e8f0; }
  h1 { font-size: 20px; }
  #hasil { white-space: pre-wrap; background: #1e293b; padding: 16px; border-radius: 8px; margin-top: 16px; font-family: monospace; font-size: 13px; }
  .ok { color: #4ade80; font-weight: bold; }
  .gagal { color: #f87171; font-weight: bold; }
  button { background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-size: 14px; }
</style>
</head>
<body>
  <h1>Tes CORS — Qasir Minum.Es</h1>
  <p>Halaman ini mencoba memanggil Web App GAS lewat <code>fetch()</code>, persis seperti yang akan dilakukan aplikasi kasir sungguhan nanti kalau sudah pindah ke GitHub Pages.</p>
  <button onclick="tesSekarang()">Mulai Tes</button>
  <div id="hasil">Klik tombol di atas untuk mulai...</div>

  <script>
    const GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbykq9jikOTBR5z6whSZg_p8u6Gq8GW0j0Obz0zWq_UE0HKKqrdUB3fU9YlpOXymvQxB/exec';

    async function tesSekarang() {
      const hasilEl = document.getElementById('hasil');
      hasilEl.textContent = 'Memanggil server, mohon tunggu...';
      try {
        const res = await fetch(GAS_WEB_APP_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ fn: 'getBranches', args: [] })
        });
        const data = await res.json();
        hasilEl.innerHTML = '<span class="ok">✅ BERHASIL! CORS lolos, data terbaca:</span>\n\n' + JSON.stringify(data, null, 2);
      } catch (err) {
        hasilEl.innerHTML = '<span class="gagal">❌ GAGAL: ' + err.message + '</span>\n\nIni kemungkinan besar soal CORS. Screenshot pesan error ini (termasuk yang muncul di Console/F12) dan kirim ke Claude.';
      }
    }
  </script>
</body>
</html>
